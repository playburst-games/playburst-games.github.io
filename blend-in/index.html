<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1b1b">
<title>Blend In</title>
<script src="../track.js?v=13"></script>
<script src="../lb.js?v=13"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#20163a;--ink:#1b1230;--card:#fff;--a:#ff6b9a;--b:#ffd23f;--c:#3bd6c6;--disp:'Lilita One',system-ui,sans-serif;--ui:'Nunito',system-ui,sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:var(--ui);user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:flex;align-items:center;gap:8px;z-index:3;pointer-events:none}
.chip{font-family:var(--disp);font-size:18px;background:rgba(0,0,0,.45);border-radius:12px;padding:4px 10px;white-space:nowrap}
.sp{flex:1}
.ib{pointer-events:auto;min-width:40px;height:36px;border:0;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-family:var(--disp);font-size:16px;padding:0 10px}
.timer{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 50px);height:10px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;z-index:3;pointer-events:none}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--b));width:100%}
.timer.low i{background:linear-gradient(90deg,#ff4d4d,#ff9f43)}
.tools{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(0deg,rgba(20,12,40,.95),rgba(20,12,40,.8));z-index:3;display:grid;gap:8px}
.trow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.tb{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;background:#33285a;color:#fff;font-family:var(--ui);font-weight:800;font-size:14px;padding:8px 10px;cursor:pointer}
.tb.on{outline:3px solid var(--b)}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff}
.go{flex:1;min-width:120px;border:0;border-radius:14px;background:linear-gradient(180deg,#ff8db3,#ff4f86);color:#fff;font-family:var(--disp);font-size:22px;padding:10px;box-shadow:0 4px 0 #b02a5a;cursor:pointer}
.meter{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;justify-content:center;white-space:nowrap}.tools .tb{padding:7px 9px;font-size:13px}.tools{gap:6px}
.meter .bar{width:110px;height:10px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d4d,#ffd23f,#3bd67a);width:0}
.hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);background:rgba(0,0,0,.65);padding:6px 12px;border-radius:12px;font-weight:800;font-size:15px;z-index:4;pointer-events:none;text-align:center;max-width:92vw}
.big{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--disp);font-size:44px;text-shadow:0 4px 0 rgba(0,0,0,.4);z-index:4;pointer-events:none;text-align:center;white-space:nowrap}
.overlay{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,12,40,.82);overflow-y:auto;touch-action:pan-y}
.panel{width:min(420px,100%);background:var(--card);color:var(--ink);border-radius:24px;padding:22px 18px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.logo{font-family:var(--disp);font-size:clamp(52px,16vw,74px);line-height:.9;margin:0;letter-spacing:1px}
.logo .b1{color:#ff6b9a}.logo .b2{color:#3bd6c6}
.tag{font-size:17px;margin:8px 0 14px;opacity:.75}
.btn{display:block;width:100%;margin-top:12px;padding:14px;border:0;border-radius:16px;font-family:var(--disp);font-size:26px;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn small{display:block;font-family:var(--ui);font-size:14px;font-weight:800;opacity:.9}
.bh{background:linear-gradient(180deg,#ff8db3,#ff4f86)}.bs{background:linear-gradient(180deg,#5fe3d6,#22b3a4)}
.btn2{display:block;width:100%;margin-top:10px;padding:11px;border:2px solid #e3dcf3;border-radius:14px;background:#fff;color:var(--ink);font-family:var(--ui);font-weight:800;font-size:17px;cursor:pointer}
.row{display:flex;gap:10px}.row>*{flex:1}
h2{font-family:var(--disp);font-weight:400;font-size:34px;margin:0}
.res{font-size:18px;margin:6px 0 2px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat div{background:#f3effa;border-radius:12px;padding:8px}
.stat b{display:block;font-family:var(--disp);font-size:26px;font-weight:400;color:#ff4f86}
.muted{opacity:.6;font-size:14px}
</style>
<canvas id="c"></canvas>

<div class="top" id="top" hidden>
  <button class="ib" id="backB">✕</button>
  <span class="chip" id="info1"></span>
  <span class="sp"></span>
  <span class="chip" id="info2"></span>
</div>
<div class="timer" id="timer" hidden><i id="timerI"></i></div>
<div class="hint" id="hint" hidden></div>
<div class="big" id="big" hidden></div>

<div class="tools" id="tools" hidden>
  <div class="meter">Camouflage <span class="bar"><i id="camI"></i></span> <span id="camT">0%</span></div>
  <div class="trow">
    <button class="tb" id="c1B"><span class="sw" id="sw1"></span>Body colour</button>
    <button class="tb" id="patB">Pattern: <span id="patT">none</span></button>
    <button class="tb" id="c2B" hidden><span class="sw" id="sw2"></span>Pattern colour</button>
  </div>
  <div class="trow">
    <button class="tb" id="szM">−</button><span id="szT" style="font-weight:800;font-size:14px">Size M</span><button class="tb" id="szP">+</button>
    <button class="tb" id="rotB">↻ Turn</button>
    <button class="tb" id="sceneB">🖼 New place</button>
  </div>
  <div class="trow"><button class="go" id="hideB">HIDE!</button></div>
</div>

<div class="overlay" id="menu">
  <div class="panel">
    <div class="logo"><span class="b1">Blend</span> <span class="b2">In</span></div>
    <p class="tag">Paint yourself. Hide in plain sight at 100+ famous places across India.</p>
    <button class="btn bh" id="modeHide">HIDE<small>Paint your creature and fool the seeker</small></button>
    <button class="btn bs" id="modeSeek">SEEK<small>Find the hidden creature before time runs out</small></button>
    <button class="btn2" id="lbT" style="width:100%;margin-top:10px">🏆 Seek leaderboard</button>
    <p class="muted" id="bestT"></p>
  </div>
</div>

<div class="overlay" id="hres" hidden>
  <div class="panel">
    <h2 id="hTitle"></h2>
    <p class="res" id="hMsg"></p>
    <div class="stat"><div><b id="hCam">0%</b>Camouflage</div><div><b id="hScore">0</b>Score</div></div>
    <button class="btn bh" id="hAgain">HIDE AGAIN</button>
    <div class="row"><button class="btn2" id="hSeek">Try Seek</button><button class="btn2" id="hMenu">Menu</button></div>
  </div>
</div>

<div class="overlay" id="sres" hidden>
  <div class="panel">
    <h2>Time's up!</h2>
    <div class="stat"><div><b id="sScore">0</b>Score</div><div><b id="sLvl">0</b>Found</div></div>
    <p class="muted" id="sBest"></p>
    <button class="btn bs" id="sAgain">SEEK AGAIN</button>
    <div class="row"><button class="btn2" id="sHide">Try Hide</button><button class="btn2" id="sMenu">Menu</button></div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const WW=400,WH=600,RES=2;
let W=0,H=0,dpr=1,scale=1,offX=0,offY=0;
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hsl=(h,s,l)=>`hsl(${h},${s}%,${l}%)`;

// ---------- save
const SAVE={bestSeek:0,bestHide:0,bestFound:0,hidesWon:0,bestCamo:0};try{const s=JSON.parse(localStorage.getItem('blendin-save1')||'null');if(s)Object.assign(SAVE,s)}catch(e){}
function store(){try{localStorage.setItem('blendin-save1',JSON.stringify(SAVE))}catch(e){}}

// ---------- audio
let AC=null;function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,v,slide){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
const SND={pick:()=>tone(880,.08,'triangle',.06),place:()=>tone(440,.06,'triangle',.05),found:()=>{tone(660,.1,'triangle',.08);setTimeout(()=>tone(990,.18,'triangle',.08),90)},miss:()=>tone(180,.15,'square',.04),tick:()=>tone(1200,.03,'square',.02),win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.15,'triangle',.07),i*90))},lose:()=>tone(300,.4,'sawtooth',.05,120)};

// ---------- scenes (seeded, so a hide can be replayed exactly)
// ---- shared painting helpers
function sky(g,top,bot,h){const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,WW,WH)}
function clouds(g,r,n,h){for(let i=0;i<n;i++){const x=r()*WW,y=10+r()*h*.6,s=10+r()*16;g.fillStyle='rgba(255,255,255,.75)';for(let k=0;k<4;k++){g.beginPath();g.ellipse(x+k*s*.9,y+Math.sin(k)*s*.3,s,s*.6,0,0,TAU);g.fill()}}}
function birds(g,r,n,h){g.strokeStyle='rgba(30,30,40,.7)';g.lineWidth=1.4;for(let i=0;i<n;i++){const x=r()*WW,y=10+r()*h,s=3+r()*4;g.beginPath();g.moveTo(x-s,y);g.quadraticCurveTo(x-s/2,y-s*.7,x,y);g.quadraticCurveTo(x+s/2,y-s*.7,x+s,y);g.stroke()}}
function person(g,r,x,y,s){const shirt=hsl(pick(r,[0,15,30,45,200,220,280,310,330,120,170]),55+r()*35,35+r()*35);const skin=pick(r,['#8d5a3b','#a86b45','#c68a5c','#6e4a33']);
  g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(x,y+s*1.6,s*.9,s*.3,0,0,TAU);g.fill();
  g.fillStyle=pick(r,['#2a2a3a','#3b4a6b','#5a3b22','#e8e0d0',shirt]);g.fillRect(x-s*.45,y+s*.6,s*.9,s*1);
  g.fillStyle=shirt;g.beginPath();g.ellipse(x,y+s*.4,s*.62,s*.75,0,0,TAU);g.fill();
  if(r()<.35){g.fillStyle=hsl(pick(r,[330,30,50,280,0]),80,55);g.beginPath();g.moveTo(x-s*.6,y);g.lineTo(x+s*.7,y+s*1.2);g.lineTo(x+s*.4,y+s*1.3);g.lineTo(x-s*.7,y+s*.2);g.fill()}
  g.fillStyle=skin;g.beginPath();g.arc(x,y-s*.45,s*.42,0,TAU);g.fill();g.fillStyle=pick(r,['#111','#2a1b10','#3a2616','#555']);g.beginPath();g.arc(x,y-s*.6,s*.42,Math.PI,TAU);g.fill();
  if(r()<.12){g.fillStyle=hsl(pick(r,[0,200,50,300]),70,50);g.beginPath();g.arc(x,y-s*1.4,s*1.1,Math.PI,TAU);g.fill();g.fillStyle='#333';g.fillRect(x-.5,y-s*1.4,1,s*1.2)}}
function crowd(g,r,y0,y1,n,s0){const ps=[];for(let i=0;i<n;i++)ps.push([r()*WW,y0+r()*(y1-y0)]);ps.sort((a,b)=>a[1]-b[1]);for(const [x,y] of ps){const s=(s0||5)*(.75+.6*(y-y0)/(y1-y0||1));person(g,r,x,y,s)}}
function pigeons(g,r,y0,y1,n){for(let i=0;i<n;i++){const x=r()*WW,y=y0+r()*(y1-y0),s=2.5+r()*2;g.fillStyle=pick(r,['#7d8592','#9aa1ab','#6b707a','#b9bec6']);g.beginPath();g.ellipse(x,y,s*1.4,s,0,0,TAU);g.fill();g.beginPath();g.arc(x+s*1.2*(r()<.5?1:-1),y-s*.6,s*.6,0,TAU);g.fill()}}
function roundTree(g,r,x,y,s){g.fillStyle='#5a3b22';g.fillRect(x-s*.12,y,s*.24,s*.9);for(let k=0;k<5;k++){g.fillStyle=hsl(100+r()*30,45,22+r()*20);g.beginPath();g.arc(x+(r()-.5)*s,y-(r()*.7)*s,s*(.45+r()*.3),0,TAU);g.fill()}}
function cypress(g,x,y,h,c){g.fillStyle=c||'#2f5a2a';g.beginPath();g.moveTo(x,y-h);g.quadraticCurveTo(x+h*.18,y-h*.4,x+h*.1,y);g.lineTo(x-h*.1,y);g.quadraticCurveTo(x-h*.18,y-h*.4,x,y-h);g.fill();g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.moveTo(x,y-h);g.quadraticCurveTo(x-h*.16,y-h*.4,x-h*.08,y);g.lineTo(x-h*.02,y);g.fill()}
function archPath(g,x,y,w,h){g.beginPath();g.moveTo(x,y+h);g.lineTo(x,y+w*.55);g.quadraticCurveTo(x,y,x+w/2,y-w*.15);g.quadraticCurveTo(x+w,y,x+w,y+w*.55);g.lineTo(x+w,y+h);g.closePath()}
function dome(g,cx,base,w,h,fill,shade){g.fillStyle=fill;g.beginPath();g.moveTo(cx-w/2,base);g.bezierCurveTo(cx-w*.62,base-h*.55,cx-w*.2,base-h*.85,cx,base-h);g.bezierCurveTo(cx+w*.2,base-h*.85,cx+w*.62,base-h*.55,cx+w/2,base);g.closePath();g.fill();
  if(shade){g.fillStyle=shade;g.beginPath();g.moveTo(cx,base-h);g.bezierCurveTo(cx+w*.2,base-h*.85,cx+w*.62,base-h*.55,cx+w/2,base);g.lineTo(cx+w*.12,base);g.closePath();g.fill()}
  g.strokeStyle='#c9a227';g.lineWidth=1.5;g.beginPath();g.moveTo(cx,base-h);g.lineTo(cx,base-h-h*.25);g.stroke();g.fillStyle='#c9a227';g.beginPath();g.arc(cx,base-h-h*.12,1.8,0,TAU);g.fill()}
function flowerBed(g,r,x,y,w,h){g.fillStyle='#3f7a33';g.fillRect(x,y,w,h);for(let i=0;i<w*h/40;i++){g.fillStyle=hsl(pick(r,[0,330,50,30,280,55]),80,55+r()*15);g.beginPath();g.arc(x+r()*w,y+r()*h,1.6+r()*1.8,0,TAU);g.fill()}}

// ---- Taj Mahal
function drawTaj(g,r){sky(g,'#7fb6e8','#f6d7b0',330);clouds(g,r,6,300);birds(g,r,10,200);
  const mar='#f4f1ea',sh='#d9d2c4',dk='#b7ad9c';
  g.fillStyle='#e8dfcf';g.fillRect(30,300,340,22);// plinth
  for(const [x,h] of [[44,165],[356,165]]){g.fillStyle=mar;g.fillRect(x-6,300-h,12,h);for(let k=1;k<4;k++){g.fillStyle=sh;g.fillRect(x-9,300-h*k/4-3,18,4)}dome(g,x,300-h,16,12,mar,sh)}
  g.fillStyle=mar;g.fillRect(105,190,190,110);g.fillStyle=sh;g.fillRect(105,190,10,110);g.fillRect(285,190,10,110);
  for(const [x,w,y,h] of [[175,50,205,95],[120,30,205,40],[120,30,255,45],[250,30,205,40],[250,30,255,45]]){g.fillStyle=dk;archPath(g,x,y,w,h);g.fill();g.fillStyle='#8b7f6c';archPath(g,x+4,y+6,w-8,h-6);g.fill()}
  g.fillStyle=mar;g.fillRect(170,175,60,18);dome(g,200,178,96,92,mar,sh);for(const x of [140,260]){g.fillStyle=mar;g.fillRect(x-14,176,28,14);dome(g,x,178,30,26,mar,sh)}
  g.strokeStyle='rgba(150,130,100,.5)';g.lineWidth=1;for(let i=0;i<14;i++){g.beginPath();g.moveTo(110+i*13,192);g.lineTo(110+i*13,198);g.stroke()}
  // gardens + pool
  g.fillStyle='#4f8a3c';g.fillRect(0,322,WW,WH-322);g.fillStyle='#d8cdb8';g.fillRect(150,322,100,WH-322);
  g.fillStyle='#5c9fd3';g.fillRect(172,326,56,WH-326);g.save();g.globalAlpha=.35;g.translate(0,652);g.scale(1,-1);g.beginPath();g.rect(172,326,56,WH);g.clip();dome(g,200,178+0,96,92,'#fff');g.restore();
  for(let i=0;i<10;i++){g.fillStyle='rgba(255,255,255,.4)';g.fillRect(176+r()*48,330+r()*260,10+r()*12,1.5)}
  for(let y=340;y<WH;y+=34){cypress(g,140,y+28,34);cypress(g,260,y+28,34)}
  flowerBed(g,r,10,340,120,60);flowerBed(g,r,270,340,120,60);flowerBed(g,r,10,450,120,50);flowerBed(g,r,270,450,120,50);
  crowd(g,r,400,600,70,5)}
// ---- Hawa Mahal
function drawHawa(g,r){sky(g,'#8fc4ef','#ffe2b3',140);clouds(g,r,4,120);birds(g,r,8,110);
  const pk='#e9967a',dk='#c46a4c',lt='#f6c2a8';g.fillStyle=pk;g.beginPath();g.moveTo(20,470);g.lineTo(20,200);g.lineTo(80,150);g.lineTo(130,105);g.lineTo(200,70);g.lineTo(270,105);g.lineTo(320,150);g.lineTo(380,200);g.lineTo(380,470);g.fill();
  const rows=[[200,470,13],[160,200,11],[125,160,9],[95,125,7],[70,95,5]];
  rows.forEach(([y0,y1,n],ri)=>{const half=(380-20)/2*(1-ri*.17);const x0=200-half,w=half*2/n;for(let j=0;j<(ri===0?6:1);j++){const yy=ri===0?y0+j*45:y0;for(let i=0;i<n;i++){const x=x0+i*w+2;g.fillStyle=lt;g.fillRect(x,yy+6,w-4,ri===0?36:y1-y0-8);g.fillStyle=dk;archPath(g,x+3,yy+10,w-10,(ri===0?30:y1-y0-14));g.fill();g.fillStyle='#5b2a1c';g.fillRect(x+w/2-3,yy+18,2,ri===0?18:6);dome(g,x+(w-4)/2,yy+7,w-6,8,pk,dk)}}});
  g.fillStyle='#d8b98a';g.fillRect(0,470,WW,WH-470);g.fillStyle='#8a8478';g.fillRect(0,500,WW,60);g.fillStyle='#fff';for(let x=10;x<WW;x+=40)g.fillRect(x,528,20,3);
  for(let i=0;i<5;i++){const x=20+r()*340,y=505+r()*30;g.fillStyle='#1f7a3a';g.fillRect(x,y,30,16);g.fillStyle='#f2c230';g.fillRect(x,y-10,30,12);g.fillStyle='#111';g.beginPath();g.arc(x+6,y+17,4,0,TAU);g.arc(x+26,y+17,4,0,TAU);g.fill()}
  for(let i=0;i<6;i++){const x=r()*360,y=470+r()*20;g.fillStyle=hsl(pick(r,[0,30,50,200,300]),70,50);g.fillRect(x,y,34,10);g.fillStyle=hsl(pick(r,[60,100,330]),70,60);for(let k=0;k<8;k++){g.beginPath();g.arc(x+3+k*4,y,2.5,0,TAU);g.fill()}}
  crowd(g,r,462,500,40,4.5);crowd(g,r,560,600,30,5.5);pigeons(g,r,465,600,20)}
// ---- Qutub Minar
function drawQutub(g,r){sky(g,'#7eb4e6','#ffd9a8',420);clouds(g,r,5,300);birds(g,r,14,260);
  const red='#b5532f',rd='#8f3d22',lt='#d77a50';const base=430,top=40,cx=230;
  for(let i=0;i<5;i++){const y0=top+(base-top)*i/5,y1=top+(base-top)*(i+1)/5,w0=14+i*7,w1=w0+7;g.fillStyle=i===4||i===3?'#e8d9c0':red;g.beginPath();g.moveTo(cx-w0,y0);g.lineTo(cx+w0,y0);g.lineTo(cx+w1,y1);g.lineTo(cx-w1,y1);g.fill();

  else{groundLayer(g,r,P,B);ST[P.s](g,r,P,B)}
  foreground(g,r,P,B)}

function sceneColor(x,y){const ix=clamp(Math.round(x*RES),0,sc.width-1),iy=clamp(Math.round(y*RES),0,sc.height-1),i=(iy*sc.width+ix)*4;return[scData[i],scData[i+1],scData[i+2]]}
const rgbStr=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const cdist=(a,b)=>Math.hypot(a[0]-b[0],(a[1]-b[1])*1.2,a[2]-b[2]);

// ---------- creature
function drawCreature(g,cr,alpha){const {x,y,r,c1,c2,pat,rot}=cr;g.save();g.translate(x,y);g.rotate(rot||0);g.globalAlpha=alpha===undefined?1:alpha;
  g.beginPath();g.ellipse(0,0,r*1.08,r*.92,0,0,TAU);g.save();g.clip();g.fillStyle=rgbStr(c1);g.fillRect(-r*1.2,-r,r*2.4,r*2);
  if(pat==='spots'){g.fillStyle=rgbStr(c2);for(const [a,b,s] of [[-.5,-.2,.28],[.45,-.35,.22],[.1,.4,.3],[-.55,.45,.18],[.65,.3,.2],[0,-.6,.16]]){g.beginPath();g.arc(a*r,b*r,s*r,0,TAU);g.fill()}}
  else if(pat==='stripes'){g.fillStyle=rgbStr(c2);for(let k=-3;k<=3;k++){g.fillRect(k*r*.42-r*.1,-r,r*.2,r*2)}}
  else if(pat==='half'){g.fillStyle=rgbStr(c2);g.fillRect(0,-r,r*1.2,r*2)}
  g.restore();
  // tiny eyes are the only giveaway
  const ph=((T+(cr.blink||0))%3.2),open=ph<.35;
  if(open){for(const s of [-1,1]){g.fillStyle='#fff';g.beginPath();g.arc(s*r*.32,-r*.18,r*.15,0,TAU);g.fill();g.fillStyle='#111';g.beginPath();g.arc(s*r*.32+r*.03,-r*.16,r*.07,0,TAU);g.fill()}}
  else{g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=Math.max(.8,r*.07);g.lineCap='round';for(const s of [-1,1]){g.beginPath();g.arc(s*r*.32,-r*.2,r*.11,.3,Math.PI-.3);g.stroke()}}
  g.restore()}
// camouflage score 0..100: how close the creature's colours are to the background right around it and under it
function busyness(x,y,r){const S=[];for(let k=0;k<40;k++){const a=k*2.4,rr=r*(1.2+(k%5)*.5);S.push(sceneColor(x+Math.cos(a)*rr,y+Math.sin(a)*rr))}const m=[0,1,2].map(i=>S.reduce((t,c)=>t+c[i],0)/S.length);return clamp(S.reduce((t,c)=>t+cdist(c,m),0)/S.length/55,0,1)}
function camoScore(cr){const {x,y,r}=cr;const cols=[cr.c1];if(cr.pat!=='none')cols.push(cr.c2);let tot=0,n=0;
  for(let k=0;k<48;k++){const a=k/48*TAU,rr=r*(k%3===0?1.15:k%3===1?1.5:2);const c=sceneColor(x+Math.cos(a)*rr,y+Math.sin(a)*rr);let m=1e9;for(const cc of cols)m=Math.min(m,cdist(c,cc));tot+=m;n++}
  for(let k=0;k<24;k++){const a=k/24*TAU,rr=r*(k%2?.35:.75);const c=sceneColor(x+Math.cos(a)*rr,y+Math.sin(a)*rr);let m=1e9;for(const cc of cols)m=Math.min(m,cdist(c,cc));tot+=m*.8;n+=.8}
  const avg=tot/n,busy=busyness(x,y,r);let sc0=100-avg*1.35;
  // a plain body on a busy background stands out; a busy pattern on a plain background stands out too
  if(cr.pat==='none'&&busy>.45)sc0-=(busy-.45)*30;if(cr.pat!=='none'&&busy<.2)sc0-=8;
  sc0+=(16-r)*.45;return clamp(Math.round(sc0),0,99)}

// ---------- layout
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr|0;cv.height=H*dpr|0;layout()}
function layout(){const topPad=58,botPad=mode==='hide'?(($('tools').offsetHeight||170)+6):12;const aw=W-12,ah=H-topPad-botPad;scale=Math.min(aw/WW,ah/WH);offX=(W-WW*scale)/2;offY=topPad+(ah-WH*scale)/2}
const toWorld=(cx,cy)=>({x:(cx-offX)/scale,y:(cy-offY)/scale});

// ---------- state
let mode='menu',T=0,phase='',me=null,picking=0,seekT=0,seekAnim=null;
let sk={lvl:0,score:0,time:0,max:0,target:null,miss:[],found:false,lives:3,reveal:0};
const SIZES=[10,13,16,20],PATS=['none','spots','stripes','half'];let sizeI=1;

function show(id,v){$(id).hidden=!v}
function hint(t,ms){const el=$('hint');el.textContent=t;el.hidden=!t;clearTimeout(hint.t);if(ms)hint.t=setTimeout(()=>el.hidden=true,ms)}
function big(t,ms,col){const el=$('big');el.textContent=t;el.style.color=col||'#fff';el.hidden=false;clearTimeout(big.t);big.t=setTimeout(()=>el.hidden=true,ms||1000)}
function newScene(){if(!Array.isArray(SAVE.order)||SAVE.order.length!==PLACES.length){SAVE.order=PLACES.map((_,i)=>i).sort(()=>Math.random()-.5);SAVE.pos=0}
  if(SAVE.pos>=SAVE.order.length){const lastId=SAVE.order[SAVE.order.length-1];do{SAVE.order.sort(()=>Math.random()-.5)}while(SAVE.order[0]===lastId&&PLACES.length>1);SAVE.pos=0}
  const id=SAVE.order[SAVE.pos++];SAVE.seen=Math.max(SAVE.seen||0,0)+1;store();buildScene(id,Math.floor(Math.random()*1e9))}

// ----- HIDE mode
function startHide(){audio();mode='hide';phase='paint';['menu','hres','sres'].forEach(k=>show(k,false));show('top',true);show('tools',true);show('timer',false);
  newScene();const c=sceneColor(WW/2,WH/2);me={x:WW/2,y:WH/2,r:SIZES[sizeI],c1:[255,107,154],c2:[59,214,198],pat:'none',rot:0};picking=0;
  $('info1').textContent=placeName(scene.id);$('info2').textContent='Hide';updTools();layout();
  hint('Drag your creature to a spot. Tap Body colour, then tap the picture to copy a colour from there.',5000)}
function updTools(){$('sw1').style.background=rgbStr(me.c1);$('sw2').style.background=rgbStr(me.c2);$('patT').textContent=me.pat;$('szT').textContent='Size '+['S','M','L','XL'][sizeI];
  $('c2B').hidden=me.pat==='none';if(me.pat==='none'&&picking===2)picking=0;$('c1B').classList.toggle('on',picking===1);$('c2B').classList.toggle('on',picking===2);const cs=camoScore(me),b=busyness(me.x,me.y,me.r);$('camI').style.width=cs+'%';$('camT').textContent=cs+'% · '+(b>.5?'busy spot ✓':b>.25?'ok spot':'plain spot ✗');layout()}
function eyesOpen(cr){return ((T+(cr.blink||0))%3.2)<.35}
function doHide(){if(phase!=='paint')return;phase='seeking';picking=0;show('tools',false);const cs=camoScore(me),busy=busyness(me.x,me.y,me.r);
  // split the picture into areas; the seeker checks the most suspicious-looking ones first
  const cells=[];for(let gy=0;gy<6;gy++)for(let gx=0;gx<4;gx++){const cx=gx*100+50,cy=gy*100+50,hasMe=Math.abs(me.x-cx)<=50&&Math.abs(me.y-cy)<=50;cells.push({x:cx,y:cy,sus:hasMe?(100-cs)*1.3+(1-busy)*25+Math.random()*35:Math.random()*60})}
  cells.sort((a,b)=>b.sus-a.sus);seekAnim={t:0,cs,busy,cells,ci:0,dwell:0,pos:{x:WW/2,y:20},done:false,findAt:99,lookNear:0};layout();
  $('info2').textContent='Seeker is searching...';show('timer',true);hint('',1)}
function seekerUpdate(dt){const s=seekAnim;s.t+=dt;const tl=10-s.t;$('timerI').style.width=clamp(tl/10*100,0,100)+'%';$('timer').classList.toggle('low',tl<3);if(s.done)return;
  const cell=s.cells[s.ci%s.cells.length];const tx=cell.x+Math.sin(s.t*3)*28,ty=cell.y+Math.cos(s.t*2.3)*28;const dx=tx-s.pos.x,dy=ty-s.pos.y,d=Math.hypot(dx,dy)||1;
  if(d>30){s.pos.x+=dx/d*Math.min(d,420*dt);s.pos.y+=dy/d*Math.min(d,420*dt)}else{s.pos.x+=dx*.2;s.pos.y+=dy*.2;s.dwell+=dt;if(s.dwell>.75){s.dwell=0;s.ci++;if(Math.random()<.25)SND.tick()}}
  const near=Math.hypot(me.x-s.pos.x,me.y-s.pos.y)<46;
  if(near){// chance per second to notice: worse camouflage, plain spots and open eyes all make it easier
    let k=Math.pow((100-s.cs)/22,1.4)+ (1-s.busy)*.6;if(eyesOpen(me))k+=2.2+(1-s.busy)*3;if(Math.random()<k*dt){s.done=true;s.findAt=s.t;s.pos.x=me.x;s.pos.y=me.y;SND.lose();big('FOUND!',1200,'#ff6b6b');setTimeout(()=>hideResult(false),1200);return}}
  if(s.t>=10){s.done=true;SND.win();big('NOT FOUND!',1300,'#5fffb0');setTimeout(()=>hideResult(true),1300)}}

function hideResult(win){if(mode!=='hide'||phase!=='seeking')return;phase='result';const t=Math.min(10,seekAnim.t);const sizeB=[1.6,1.25,1,.8][sizeI];const score=Math.round((win?1000:t*80)*sizeB+seekAnim.cs*3);
  const nb=score>SAVE.bestHide;if(nb)SAVE.bestHide=score;if(win)SAVE.hidesWon=(SAVE.hidesWon||0)+1;SAVE.bestCamo=Math.max(SAVE.bestCamo||0,seekAnim.cs);store();
  $('hTitle').textContent=win?'You blended in! 🦎':'Spotted! 👀';$('hTitle').style.color=win?'#22b37a':'#ff4f86';
  $('hMsg').textContent=win?'The seeker searched for 10 seconds and gave up.'+(nb?' New best!':''):'Found in '+t.toFixed(1)+' seconds. Tip: hide in a busy spot, match colours, and add a pattern. Blinking eyes give you away!';
  $('hCam').textContent=seekAnim.cs+'%';$('hScore').textContent=score;show('timer',false);show('hres',true)}

// ----- SEEK mode
function startSeek(){audio();mode='seek';['menu','hres','sres','tools'].forEach(k=>show(k,false));show('top',true);show('timer',true);sk={lvl:0,score:0,lives:3};layout();nextRound()}
function makeComputerHide(level){// try many spots, keep one with camouflage near the target for this level
  const target=clamp(46+level*4,50,94),r=clamp(16-level*.5,8,15.5);let best=null,bd=1e9;
  for(let k=0;k<80;k++){const x=r*2+Math.random()*(WW-r*4),y=r*2+Math.random()*(WH-r*4);
    const samp=[];for(let j=0;j<16;j++){const a=Math.random()*TAU,rr=r*Math.random()*1.4;samp.push(sceneColor(x+Math.cos(a)*rr,y+Math.sin(a)*rr))}
    const avg=[0,1,2].map(i=>samp.reduce((s,c)=>s+c[i],0)/samp.length);let far=samp[0],fd=-1;for(const c of samp){const d=cdist(c,avg);if(d>fd){fd=d;far=c}}
    let near=samp[0],nd=1e9;for(const c of samp){const d=cdist(c,avg);if(d<nd){nd=d;near=c}}
    const pat=fd>60?pick(Math.random,['spots','stripes','half']):'none';const cr={x,y,r,c1:near.slice(),c2:far.slice(),pat,rot:Math.random()*TAU,blink:Math.random()*3};const cs=camoScore(cr);const d=Math.abs(cs-target);if(d<bd){bd=d;best=cr}}
  return best}
function nextRound(){sk.lvl++;newScene();sk.target=makeComputerHide(sk.lvl);sk.max=sk.lvl<=3?8:sk.lvl<=6?10:sk.lvl<=9?12:15;sk.time=sk.max;sk.miss=[];sk.found=false;sk.reveal=0;phase='seek';
  $('info1').textContent='Round '+sk.lvl+' · '+placeName(scene.id);updSeekHud();if(sk.lvl===1)hint('A creature is hiding here. Its eyes open for a split second every few seconds. Watch for the blink!',4500)}
function updSeekHud(){$('info2').textContent='❤'.repeat(sk.lives)+'  '+sk.score}
function seekTap(p){if(phase!=='seek')return;const t=sk.target;if(Math.hypot(p.x-t.x,p.y-t.y)<t.r*1.5+4){sk.found=true;phase='reveal';const pts=Math.round(100+sk.time*25+sk.lvl*20);sk.score+=pts;sk.found_n=(sk.found_n||0)+1;sk.newBest=sk.newBest||sk.score>SAVE.bestSeek;if(sk.score>SAVE.bestSeek)SAVE.bestSeek=sk.score;SAVE.bestFound=Math.max(SAVE.bestFound||0,sk.found_n);store();SND.found();big('+'+pts,900,'#5fffb0');updSeekHud();setTimeout(()=>{if(mode==='seek')nextRound()},1300)}
  else{sk.miss.push({x:p.x,y:p.y,t:0});sk.time=Math.max(0,sk.time-1);SND.miss()}}
function seekUpdate(dt){for(const m of sk.miss)m.t+=dt;if(phase==='seek'){sk.time-=dt;if(sk.time<=0){sk.lives--;updSeekHud();phase='reveal';SND.lose();big(sk.lives>0?'Missed it!':'Game over',1200,'#ff6b6b');setTimeout(()=>{if(mode!=='seek')return;if(sk.lives>0)nextRound();else seekOver()},1700)}}
  if(phase==='reveal')sk.reveal+=dt;$('timerI').style.width=clamp(sk.time/sk.max*100,0,100)+'%';$('timer').classList.toggle('low',sk.time<3)}
function seekOver(){phase='over';const nb=!!sk.newBest&&sk.score>=SAVE.bestSeek;$('sScore').textContent=sk.score;$('sLvl').textContent=sk.found_n||0;$('sBest').textContent=nb?'🎉 New best score!':'Best: '+SAVE.bestSeek;show('timer',false);show('sres',true);
  if(nb&&window.LB&&LB.enabled)setTimeout(()=>LB.offer('blend-in',sk.score,{wave:sk.found_n||0}),700)}

function toMenu(){mode='menu';phase='';['top','tools','timer','hres','sres','hint','big'].forEach(k=>show(k,false));$('bestT').innerHTML=(SAVE.bestSeek||SAVE.bestHide)?`🔍 Seek best: <b>${SAVE.bestFound||0}</b> found (${SAVE.bestSeek} pts)<br>🦎 Hide: fooled the seeker <b>${SAVE.hidesWon||0}</b> times · best camouflage ${SAVE.bestCamo||0}%`:'';show('menu',true)}

// ---------- draw
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#20163a';ctx.fillRect(0,0,W,H);
  if(mode==='menu'){drawMenuBg();return}
  if(!sc)return;ctx.save();ctx.translate(offX,offY);ctx.scale(scale,scale);
  ctx.save();ctx.beginPath();ctx.roundRect?ctx.roundRect(0,0,WW,WH,10):ctx.rect(0,0,WW,WH);ctx.clip();ctx.drawImage(sc,0,0,WW,WH);
  if(mode==='hide'&&me){drawCreature(ctx,me);if(phase==='paint'){ctx.strokeStyle='rgba(255,255,255,.85)';ctx.setLineDash([4,4]);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(me.x,me.y,me.r*1.5,0,TAU);ctx.stroke();ctx.setLineDash([])}
    if(seekAnim&&phase!=='paint'){const p=seekAnim.pos;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(0,0,26,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,26,0,TAU);ctx.stroke();ctx.strokeStyle='#ffd23f';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(19,19);ctx.lineTo(36,36);ctx.stroke();ctx.restore();
      if(seekAnim.done&&seekAnim.t<seekAnim.findAt+5&&seekAnim.findAt<99){ctx.strokeStyle='#ff4d6d';ctx.lineWidth=3;ctx.beginPath();ctx.arc(me.x,me.y,me.r*1.8,0,TAU);ctx.stroke()}}}
  if(mode==='seek'&&sk.target){drawCreature(ctx,sk.target);for(const m of sk.miss){if(m.t>.7)continue;ctx.globalAlpha=1-m.t/.7;ctx.strokeStyle='#ff4d6d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(m.x-8,m.y-8);ctx.lineTo(m.x+8,m.y+8);ctx.moveTo(m.x+8,m.y-8);ctx.lineTo(m.x-8,m.y+8);ctx.stroke();ctx.globalAlpha=1}
    if(phase==='reveal'||phase==='over'){const t=sk.target,pr=t.r*(1.6+Math.sin(T*8)*.15);ctx.strokeStyle=sk.found?'#5fffb0':'#ff4d6d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(t.x,t.y,pr,0,TAU);ctx.stroke();ctx.globalAlpha=.25;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(t.x,t.y,pr,0,TAU);ctx.fill();ctx.globalAlpha=1}}
  ctx.restore();ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2/scale;ctx.strokeRect(0,0,WW,WH);ctx.restore();
  if(picking){ctx.fillStyle='rgba(255,210,63,.9)';ctx.font='800 15px Nunito,sans-serif';ctx.textAlign='center';ctx.fillText('Tap the picture to copy a colour',W/2,offY+18)}}
let mbS=null;function drawMenuBg(){if(!mbS){buildScene(0,7);mbS=sc}ctx.globalAlpha=.35;const s=Math.max(W/WW,H/WH);ctx.drawImage(mbS,(W-WW*s)/2,(H-WH*s)/2,WW*s,WH*s);ctx.globalAlpha=1}

// ---------- input
let drag=null;
cv.addEventListener('pointerdown',e=>{audio();const p=toWorld(e.clientX,e.clientY);if(p.x<0||p.y<0||p.x>WW||p.y>WH)return;
  if(mode==='hide'&&phase==='paint'){if(picking){const c=sceneColor(p.x,p.y);if(picking===1)me.c1=c;else me.c2=c;picking=0;SND.pick();updTools();return}
    drag={id:e.pointerId,dx:me.x-p.x,dy:me.y-p.y};if(Math.hypot(p.x-me.x,p.y-me.y)>me.r*2.5){drag.dx=0;drag.dy=0;me.x=p.x;me.y=p.y;updTools()}try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  else if(mode==='seek')seekTap(p)});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const p=toWorld(e.clientX,e.clientY);me.x=clamp(p.x+drag.dx,me.r,WW-me.r);me.y=clamp(p.y+drag.dy,me.r,WH-me.r);updTools()});
const endDrag=e=>{if(drag&&e.pointerId===drag.id){drag=null;SND.place()}};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
$('c1B').onclick=()=>{picking=picking===1?0:1;updTools()};$('c2B').onclick=()=>{picking=picking===2?0:2;updTools()};
$('patB').onclick=()=>{me.pat=PATS[(PATS.indexOf(me.pat)+1)%PATS.length];updTools()};
$('szM').onclick=()=>{sizeI=Math.max(0,sizeI-1);me.r=SIZES[sizeI];updTools()};$('szP').onclick=()=>{sizeI=Math.min(3,sizeI+1);me.r=SIZES[sizeI];updTools()};
$('rotB').onclick=()=>{me.rot=(me.rot+Math.PI/4)%TAU;updTools()};
$('sceneB').onclick=()=>{newScene();$('info1').textContent=placeName(scene.id);updTools()};
$('hideB').onclick=doHide;
$('modeHide').onclick=startHide;$('modeSeek').onclick=startSeek;$('backB').onclick=toMenu;
$('hAgain').onclick=startHide;$('hSeek').onclick=startSeek;$('hMenu').onclick=toMenu;$('sAgain').onclick=startSeek;$('sHide').onclick=startHide;$('sMenu').onclick=toMenu;

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;if(!window.__noloop){if(mode==='hide'&&phase==='seeking')seekerUpdate(dt);if(mode==='seek')seekUpdate(dt)}draw();requestAnimationFrame(frame)}
addEventListener('resize',resize);resize();toMenu();try{new ResizeObserver(()=>layout()).observe($('tools'))}catch(e){}requestAnimationFrame(frame);
window.__bi={ev:c=>eval(c)};
})();
</script>

<script>document.getElementById("lbT").onclick=()=>window.LB&&LB.show("blend-in");document.getElementById("modeSeek").addEventListener("click",()=>window.track&&track("blend-in/seek-start"));document.getElementById("modeHide").addEventListener("click",()=>window.track&&track("blend-in/hide-start"));</script>
</body></html>
