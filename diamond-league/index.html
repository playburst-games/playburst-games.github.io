const cv=document.getElementById('game'),ctx=cv.getContext('2d');const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
// ================= WORLD (top-down, units ≈ 0.42 ft) =================

const TEAMS=[{n:'COMETS',c:'#3d8bff',e:'☄️'},{n:'TITANS',c:'#e8463c',e:'🛡️'},{n:'PHANTOMS',c:'#8a5cf6',e:'👻'},{n:'FALCONS',c:'#f0a020',e:'🦅'},{n:'ROCKETS',c:'#14b8a6',e:'🚀'},{n:'WOLVES',c:'#64748b',e:'🐺'},{n:'CYCLONES',c:'#22a447',e:'🌪️'},{n:'ROYALS',c:'#d946a8',e:'👑'}];

const pitches=[{name:'FASTBALL',speed:1.1,bx:0,bh:0},{name:'CURVE',speed:.72,bx:-22,bh:1.7},{name:'SLIDER',speed:.9,bx:-125,bh:.2},{name:'CHANGEUP',speed:.63,bx:0,bh:.55}];
const HOMEPOS=[[480,392,'P'],[612,372,'1B'],[548,282,'2B'],[350,372,'3B'],[412,290,'SS'],[255,215,'LF'],[480,140,'CF'],[705,215,'RF'],[480,578,'C']];
const F=HOMEPOS.map(([x,y,l],i)=>({i,x,y,hx:x,hy:y,l,goal:null,react:0}));
const IDX={P:0,'1B':1,'2B':2,'3B':3,SS:4,LF:5,CF:6,RF:7,C:8};
function pathPos(p){p=clamp(p,0,4);const i=Math.min(3,Math.floor(p)),k=p-i,a=BP[i],b=BP[i+1];return{x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k)}}

// ================= GAME STATE =================
let s={hand:(()=>{try{return localStorage.getItem('dlHand')||'R'}catch(e){return 'R'}})(),batHand:'R',batC:0,userC:0,contact:null,trail:[],pitchLog:[],gl:{x:17,y:-24},gloveHold:0,heldRel:null,catchFx:null,team:0,oppPick:1,champOpps:[1,2,3],steal:{},stealLead:{},stats:null,aimDir:0,mode:'menu',view:'pitch',phase:'menu',inning:1,half:0,innings:3,outs:0,balls:0,strikes:0,score:[0,0],bases:[false,false,false],difficulty:1,team:0,opponent:1,pitchType:0,aim:{x:480,y:470},pitch:null,play:null,champRound:0,champWins:0,pops:[],parts:[],shake:0,clock:0,gameOver:false,paused:false,swingT:9,pendingFinish:false,cheerT:0};

function persist(){try{localStorage.setItem('diamondLeagueSave',JSON.stringify({wins:s.champWins,round:s.champRound,team:s.team,opps:s.champOpps}))}catch(e){}}
const userBats=()=>s.half===0;
// ================= SOUND =================
// ---------- audio engine: everything is synthesised, routed through one master volume
let ac=null,master=null,bus=null,NB=null,crowdG=null,crowdOn=false,lastStep=0,lastBounce=0;
let soundOn=(()=>{try{return localStorage.getItem('dlSound')!=='0'}catch(e){return true}})();
function audio(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=soundOn?.9:0;const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;bus=ac.createGain();bus.connect(master).connect(comp).connect(ac.destination);
   NB=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function setSound(on){soundOn=on;try{localStorage.setItem('dlSound',on?'1':'0')}catch(e){}if(audio())master.gain.setTargetAtTime(on?.9:0,ac.currentTime,.05);const b=document.getElementById('sndBtn');if(b)b.textContent=on?'🔊':'🔇'}
function noise(d,f,q,v,type,o){const a=audio();if(!a||!soundOn)return;o=o||{};const t=a.currentTime+(o.delay||0);const n=a.createBufferSource();n.buffer=NB;const fl=a.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(f,t);if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+d);fl.Q.value=q;const g=a.createGain();const at=o.attack||0;
 g.gain.setValueAtTime(at?0.0001:v,t);if(at)g.gain.exponentialRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(fl).connect(g).connect(bus);n.start(t,Math.random()*1.5);n.stop(t+d+.05)}
function tone(f,d,v,type,delay,f2){const a=audio();if(!a||!soundOn)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(delay||0);o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(bus);o.start(t);o.stop(t+d+.02)}
// crowd bed: a quiet murmur that swells with the action
function crowdStart(){return;const a=audio();if(!a||crowdOn)return;crowdOn=true;const n=a.createBufferSource();n.buffer=NB;n.loop=true;const lp=a.createBiquadFilter();lp.type='bandpass';lp.frequency.value=700;lp.Q.value=.5;crowdG=a.createGain();crowdG.gain.value=.018;n.connect(lp).connect(crowdG).connect(bus);n.start()}
function crowdLvl(level,secs){return;const t=ac.currentTime;crowdG.gain.cancelScheduledValues(t);crowdG.gain.setTargetAtTime(.018+level*.07,t,.08);crowdG.gain.setTargetAtTime(.018,t+(secs||1.2),.6)}
function claps(n,spread,vol){for(let i=0;i<n;i++)noise(.035,rnd(1400,2600),1.5,vol*rnd(.5,1),'bandpass',{delay:Math.random()*spread})}
const sfx={
 crack:()=>{noise(.06,3200,1,.55,'highpass');tone(1400,.05,.12,'triangle',0,700);tone(170,.09,.22,'triangle')},
 pop:()=>{noise(.06,600,1.8,.4);tone(120,.07,.2)},// ball into a glove
 mitt:(hard)=>{noise(.07,700,2,hard?.6:.45);tone(95,.09,hard?.28:.2);noise(.04,2400,2,.08,'highpass',{delay:.01})},
 whiff:()=>noise(.22,500,.8,.25,'bandpass',{f2:1600,attack:.06}),
 windup:()=>noise(.35,300,.7,.05,'bandpass',{f2:900,attack:.2}),

 throwB:()=>noise(.2,700,1.2,.12,'bandpass',{f2:2000,attack:.03}),
 bounce:(v)=>{const k=clamp(v/260,.15,1);noise(.07,260,1.2,.35*k,'lowpass');tone(70+40*k,.06,.12*k)},
 wall:()=>{noise(.18,180,1,.5,'lowpass');tone(60,.18,.25)},
 step:()=>{const n=performance.now();if(n-lastStep<75)return;lastStep=n;noise(.035,rnd(350,520),2,.07,'bandpass');},
 cheer:()=>{s.cheerT=1.4;claps(22,1.2,.07);noise(.9,850,.7,.045,'lowpass',{attack:.12})},
 groan:()=>{noise(.7,420,.9,.04,'bandpass',{f2:230,attack:.1})},
 ooh:()=>{noise(.55,480,1,.028,'bandpass',{f2:760,attack:.2})},
 applause:()=>{claps(10,.8,.05)},
 out:()=>{tone(300,.16,.09,'sawtooth',0,190);noise(.12,900,3,.05,'bandpass',{delay:.02})},// umpire's "OUT!"
 safe:()=>{tone(260,.1,.07,'sawtooth',0,320);tone(330,.18,.07,'sawtooth',.11,240)},// "SAFE!"
 ump:()=>{tone(240,.09,.08,'sawtooth',0,300);tone(300,.22,.08,'sawtooth',.1,170)},// "STEE-RIKE!"
 click:()=>tone(660,.04,.04,'triangle'),
 organ:()=>{[392,494,587,784].forEach((f,i)=>{tone(f,.22,.035,'sine',i*.16);tone(f*2,.22,.012,'sine',i*.16)})},
 hr:()=>{s.cheerT=3;claps(44,2.4,.08);noise(1.6,800,.7,.06,'lowpass',{attack:.2});[523,659,784,1047].forEach((f,i)=>tone(f,.2,.06,'square',i*.12))}};
// ================= UI =================
function button(label,fn,kind){const b=document.createElement('button');b.textContent=label;if(kind)b.className=kind;b.addEventListener('click',e=>{audio();sfx.click();fn(e)});return b}
function modal(tag,title,text,items,html){$('modalTag').textContent=tag;$('modalTitle').textContent=title;$('modalText').textContent=text;$('modalHtml').innerHTML=html||'';const r=$('modalButtons');r.replaceChildren();for(const [l,fn,k] of items)r.append(button(l,fn,k||''));$('overlay').classList.remove('hidden')}
function hideModal(){$('overlay').classList.add('hidden')}
function menu(){s.paused=true;modal('ARCADE SPORTS','⚾ DIAMOND LEAGUE','Real baseball rules: force outs, tag outs, fly outs, tag-ups, fouls and home runs.\nYou run the bases when batting and choose every throw when fielding.',[['QUICK MATCH',()=>setup('quick'),'gold'],['CHAMPIONSHIP',()=>setup('champ')],['HOW TO PLAY',howTo],['← MORE GAMES',()=>{location.href='../'}],['RESUME',()=>{if(s.phase!=='menu'&&!s.gameOver){s.paused=false;hideModal()}}]])}
function howTo(){modal('GAME GUIDE','HOW TO PLAY',`⚾ BATTING
1. Aim: ◀ LEFT, ▲ CENTER or RIGHT ▶ (stays selected).
2. Swing: ⬇ GROUND (stays low, finds gaps, never a home run) or ⬆ AIR (line drive / fly ball — can be a home run, but can be caught).
The box goes white → yellow (get ready) → GREEN (perfect). Early pulls the ball left, late pushes it right; way off = foul.
Keys: arrows to aim, J = ground, K / Space = air.
3. Stance: when each new batter comes up you choose right- or left-handed and where he stands in the box (away / middle / close). He keeps it until his turn is over — closer makes outside pitches easier to hit but inside ones harder; away is the opposite. A right-hander pulls early swings to left field, a left-hander to right field. Rule: feet must stay inside the box, and you can't switch sides once the pitcher is set.

🏃 RUNNING (after you hit)
The batter runs to 1st by himself. Forced runners run by themselves.
Every runner has ◀ ▶ buttons: ▶ sends him to the next base (tap again to keep going), ◀ calls him back to the base he just left.
Rules: the batter can never go back home. A FORCED runner (the base behind him is needed by the runner behind) can't go back once the ball is on the ground — but on a fly ball in the air he can. Any runner who isn't forced can be called back at any time.
On a fly ball, wait! If it's caught, runners must go back and touch their base (tag up) before advancing.

🎯 PITCHING
Pick a pitch, tap the zone to aim (that is where it will END UP), then PITCH.
• FASTBALL: fast and straight.
• CURVE: slow, looks high, then drops.
• SLIDER: quick, breaks sideways late.
• CHANGEUP: looks like a fastball but arrives slow.
Mix your pitches — the batter gets fooled by changes and catches on if you repeat the same one. Aim outside the box to throw a ball on purpose.

🧤 FIELDING (after they hit)
Your nearest fielder runs to the ball. Once he has it, YOU choose: throw to 1ST / 2ND / 3RD / HOME, or TAG a runner. Glowing buttons = an out is possible there. Tap a base on the field to throw there too.

📖 RULES
Force out: touch the base before a forced runner gets there. Tag out: touch a runner who is off a base. Caught fly = out. Foul = strike (not the 3rd). 3 outs = switch sides.`,[['BACK',menu,'gold']])}
function pickTeam(tag,title,exclude,cb,back){let h='<div class="teams">';TEAMS.forEach((t,i)=>{if(i===exclude)return;h+=`<button class="team" data-t="${i}" style="--c:${t.c}"><span>${t.e}</span>${t.n}</button>`});h+='</div>';

function drawCelebration(dt){const c=s.celebrate;if(!c)return;const t=c.t;
